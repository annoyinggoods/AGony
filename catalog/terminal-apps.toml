# AGony's app directory — the checked-in seed catalog (Part11 §11.2.1).
#
# One `[[app]]` entry per terminal app, seeded from the awesome-terminal
# and awesome-tui lists via scripts/import-awesome.py, then reviewed by
# hand: every license here was verified against the project's repository
# (or crates.io) when the entry landed. The AGony built-ins and the GPL
# shelf's flapioca live in the embedded manifests, not here.
#
# Categories: files | shell | text | dev | game | net | system
# Install recipes are the user-facing commands the directory runs
# (winget, then scoop, then cargo/go — Part11 §11.3.2's dispatch order);
# entries without a recipe show their source instead.

[[app]]
id = "bat"
name = "Bat"
description = "A cat clone with syntax highlighting and git integration"
exec = "bat"
category = "text"
icon = "book"
source = "https://github.com/sharkdp/bat"
license = "MIT OR Apache-2.0"
install = { scoop = "bat", cargo = "bat" }

