[package]
name = "agony-core"
version = "0.9.0"
edition = "2021"
publish = false
license-file = "../../LICENSE"

[dependencies]
# Rect and layout types only; no backend features — this crate stays pure.
ratatui = { version = "=0.29.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Part02 2.6.1: the settings model is TOML; (de)serialization lives here so
# the format is owned in one place. The file IO stays in the shell.
toml = "0.9"

[dev-dependencies]
proptest = "1.12.0"
